# ---------------------------------------------------------------------------
# boardgames-rag — runtime configuration
#
# Loaded by `boardgames_rag.config.Settings`. CLI flags override these.
# Secrets live in .env, not here.
# ---------------------------------------------------------------------------

qdrant:
  url: http://localhost:6333
  collection: boardgames
  # Distance metric for the dense vectors. Cosine is correct for normalized
  # bge embeddings.
  distance: Cosine

embedding:
  # Swap to BAAI/bge-base-en-v1.5 (~440MB) when you want more headroom.
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 32
  # bge models expect L2-normalized vectors paired with Cosine distance.
  normalize: true

chunking:
  target_tokens: 512
  overlap_tokens: 50
  tokenizer: cl100k_base

ingest:
  source_dir: ./data/raw

retrieval:
  # Number of results returned after fusion.
  top_k: 10
  # Each retriever overfetches this many candidates before fusion. Giving the
  # fusion stage room to promote results that only one retriever found.
  k_per_retriever: 20

  bm25:
    # Pickled index lives at <index_dir>/<collection>.pkl.
    index_dir: ./data/bm25
    # Standard rank-bm25 / Okapi parameters.
    k1: 1.5
    b: 0.75

  fusion:
    # "rrf" (Reciprocal Rank Fusion) or "weighted".
    method: rrf
    # RRF constant. 60 is the canonical Cormack et al. value; higher dampens
    # the influence of rank position.
    rrf_k: 60
    # For "weighted" fusion only: dense gets `weighted_alpha`, BM25 gets
    # `1 - weighted_alpha`. Ignored when method is "rrf".
    weighted_alpha: 0.5
