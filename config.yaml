# ---------------------------------------------------------------------------
# boardgames-rag — runtime configuration
#
# Loaded by `boardgames_rag.config.Settings`. CLI flags override these.
# Secrets live in .env, not here.
# ---------------------------------------------------------------------------

qdrant:
  url: http://localhost:6333
  collection: boardgames
  # Distance metric for the dense vectors. Cosine is correct for normalized
  # bge embeddings.
  distance: Cosine

embedding:
  # Swap to BAAI/bge-base-en-v1.5 (~440MB) when you want more headroom.
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 32
  # bge models expect L2-normalized vectors paired with Cosine distance.
  normalize: true

chunking:
  target_tokens: 512
  overlap_tokens: 50
  tokenizer: cl100k_base

ingest:
  source_dir: ./data/raw

retrieval:
  # Number of results returned after fusion.
  top_k: 10
  # Each retriever overfetches this many candidates before fusion. Giving the
  # fusion stage room to promote results that only one retriever found.
  k_per_retriever: 20

  bm25:
    # Pickled index lives at <index_dir>/<collection>.pkl.
    index_dir: ./data/bm25
    # Standard rank-bm25 / Okapi parameters.
    k1: 1.5
    b: 0.75

  fusion:
    # "rrf" (Reciprocal Rank Fusion) or "weighted".
    method: rrf
    # RRF constant. 60 is the canonical Cormack et al. value; higher dampens
    # the influence of rank position.
    rrf_k: 60
    # For "weighted" fusion only: dense gets `weighted_alpha`, BM25 gets
    # `1 - weighted_alpha`. Ignored when method is "rrf".
    weighted_alpha: 0.5

rerank:
  # When false, the answer pipeline skips reranking and uses the fused order.
  enabled: true
  # Cross-encoder model. Downloads ~280MB from Hugging Face on first use.
  model_name: BAAI/bge-reranker-base
  device: cpu
  # Chunks kept after the cross-encoder re-scores the retrieved candidates.
  top_k: 5

generation:
  # "ollama" or "groq". Both speak the OpenAI chat-completions protocol.
  # Override per-run on the eval CLI with --llm-provider groq.
  backend: ollama
  # Ollama's OpenAI-compatible API. Run `ollama pull llama3.2:3b` first.
  base_url: http://localhost:11434/v1
  # Model used when backend == "ollama".
  model: llama3.2:3b
  # Model used when backend == "groq". Free-tier 70B — picked to fix the
  # week-5 weak-critic / weak-generator regression for the agent eval.
  groq_model: llama-3.3-70b-versatile
  # Low temperature — rules answers should be deterministic, not creative.
  temperature: 0.1
  max_tokens: 1024
  timeout_seconds: 120.0
  # Reranked chunks placed into the prompt as numbered context.
  max_context_chunks: 5

eval:
  # Curated test set (committed) and where run results are written.
  testset_path: eval/testset.jsonl
  results_dir: eval/results
  # Judge LLM provider (override per-run with --judge-provider):
  #   ollama — local model, no API quota; $0 but slow and a noisier judge
  #   gemini — hosted; with billing enabled it is fast, ~pennies per run,
  #            and a stronger / less-noisy judge than the local model
  #   groq   — hosted; the free tier's daily token quota cannot cover a run
  # Default stays "ollama" so the repo is $0-to-run out of the box.
  judge_provider: ollama
  judge_model: llama3.1:latest
  # Native Ollama endpoint — used only when judge_provider is "ollama".
  judge_base_url: http://localhost:11434
  judge_temperature: 0.0
  # Ragas concurrency.
  max_workers: 2
  timeout_seconds: 180
  max_retries: 5

agent:
  # Retrieval attempts (initial + reformulated retries) before the agentic
  # loop falls back to web search. 2 = initial try + one critic-driven retry.
  max_retrieval_attempts: 2
  # When true, exhausting the attempts triggers a DuckDuckGo web search.
  # Off by default — week-5 eval showed thin web snippets cause the small
  # generator to hallucinate and crash context-recall; rulebooks-only is
  # safer. Re-enable here (or via overrides) for deployments that want it.
  web_fallback_enabled: false
  web_results: 5
