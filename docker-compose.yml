services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: boardgames-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO

volumes:
  qdrant_storage:
    name: boardgames_rag_qdrant_storage
